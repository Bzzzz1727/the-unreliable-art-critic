<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>THE UNRELIABLE ART CRITIC — Interactive Art Critique Experience</title>
    <meta name="description" content="An interactive art critique experience with questionable authority. Upload your artwork, receive design critiques, and challenge the critic." />
    
    <!-- Mobile Native App & Viewport Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Art Critic" />
    <meta name="application-name" content="The Unreliable Art Critic" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F7F6F2" id="meta-theme-color" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M2 12C6 6 18 6 22 12C18 18 6 18 2 12Z' stroke='%23D71920' stroke-width='2' fill='none'/><circle cx='12' cy='12' r='3' fill='%23D71920'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('CRITIC_THEME');
          var theme = 'day';
          if (saved === 'day' || saved === 'night') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'night';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'night' ? '#111111' : '#F7F6F2');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'day');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#D71920] selection:text-white" style="background-color: var(--bg); color: var(--text);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
